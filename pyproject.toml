[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-optimizer"
version = "0.1.0"
description = "Models a battery charging and discharging across two wholesale electricity markets to maximise profit"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
chart = [
    "matplotlib>=3.8",
]

[project.scripts]
battery-optimizer = "battery_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
